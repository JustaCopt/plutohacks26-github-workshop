<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b1b">
    <title>PlutoHacks 2026 — Countdown</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="countdown-card">
      <div class="orbit orbit-one" aria-hidden="true"></div>
      <div class="orbit orbit-two" aria-hidden="true"></div>

      <header class="event-header">
        <p class="eyebrow"><span class="status-dot" aria-hidden="true"></span> PlutoHacks 2026</p>
        <h1>Make something<br><span>out of this world.</span></h1>
      </header>

      <section class="timer" aria-label="Hackathon countdown" aria-live="polite">
        <p class="timer-label" id="timer-label">Hacking starts in</p>
        <div class="time-grid" id="time-grid">
          <div class="time-unit"><span class="time-value" id="days">00</span><span class="time-caption">Days</span></div>
          <span class="time-separator" aria-hidden="true">:</span>
          <div class="time-unit"><span class="time-value" id="hours">00</span><span class="time-caption">Hours</span></div>
          <span class="time-separator" aria-hidden="true">:</span>
          <div class="time-unit"><span class="time-value" id="minutes">00</span><span class="time-caption">Minutes</span></div>
          <span class="time-separator" aria-hidden="true">:</span>
          <div class="time-unit"><span class="time-value" id="seconds">00</span><span class="time-caption">Seconds</span></div>
        </div>
      </section>

      <footer class="event-footer">
        <span class="footer-line" aria-hidden="true"></span>
        <p>One weekend. Infinite possibilities.</p>
        <span class="footer-line" aria-hidden="true"></span>
      </footer>
    </main>
  </body>
</html>
